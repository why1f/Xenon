name: Linux builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/linux-build.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "agent.toml.example"
      - "crates/**"
      - "migrations/**"
      - "packaging/**"
      - "proto/**"
      - "scripts/bootstrap-test.sh"
      - "scripts/install-agent.sh"
      - "scripts/install-test.sh"
      - "scripts/xenon-tui.sh"
      - "xenon.toml.example"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  XRAY_BINARY_VERSION: 26.6.27

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: xenon-linux-x86_64
            target: x86_64-unknown-linux-gnu
            xray_asset: Xray-linux-64.zip
            xray_archive_sha256: b3e5902d06d6282fe53cfa2fc426058b9aeaa429b2c812e20887cd47f26d08bf
          - artifact: xenon-linux-aarch64
            target: aarch64-unknown-linux-gnu
            xray_asset: Xray-linux-arm64-v8a.zip
            xray_archive_sha256: 13a251379bea366c2cf10363ad71e75734193d401f26f518bf0c25e5c8f8c931

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.0

      - name: Download and verify Xray-core
        env:
          XRAY_ASSET: ${{ matrix.xray_asset }}
          XRAY_ARCHIVE_SHA256: ${{ matrix.xray_archive_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .ci-xray
          archive=".ci-xray/${XRAY_ASSET}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_BINARY_VERSION}/${XRAY_ASSET}" \
            --output "$archive"
          printf '%s  %s\n' "$XRAY_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" xray LICENSE -d .ci-xray
          chmod 0755 .ci-xray/xray
          printf 'XRAY_BINARY_PATH=%s/.ci-xray/xray\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'XRAY_BINARY_SHA256=%s\n' "$(sha256sum .ci-xray/xray | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo zigbuild --locked --release --target "${{ matrix.target }}.2.17" -p xenon -p xenon-agent

      - name: Inspect binaries
        run: |
          set -euo pipefail
          for binary in xenon xenon-agent; do
            path="target/${{ matrix.target }}/release/${binary}"
            file "$path"
            readelf -h "$path"
            required_glibc="$({
              readelf -W --version-info "$path" \
                | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p'
            } | sort -V | tail -n 1)"
            [ -n "$required_glibc" ] || {
              printf 'could not determine GLIBC requirement for %s\n' "$path" >&2
              exit 1
            }
            printf '%s requires at most GLIBC_%s\n' "$binary" "$required_glibc"
            [ "$(printf '%s\n' "$required_glibc" 2.17 | sort -V | tail -n 1)" = "2.17" ] || {
              printf '%s requires GLIBC_%s, newer than allowed GLIBC_2.17\n' \
                "$binary" "$required_glibc" >&2
              exit 1
            }
          done

      - name: Verify embedded Xray metadata
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          info="$(target/${{ matrix.target }}/release/xenon-agent version-info)"
          printf '%s\n' "$info"
          grep -Fxq 'embedded_xray_version=26.6.27' <<<"$info"
          grep -Fxq 'embedded_xray_available=true' <<<"$info"
          grep -Fxq "embedded_xray_sha256=${XRAY_BINARY_SHA256}" <<<"$info"

      - name: Smoke-test embedded Xray memfd startup
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          cargo test --locked --release -p xray-embedded-runner
          embedded_xray_accepts_json_config_from_memfd

      - name: Package artifact
        env:
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          root="dist/${ARTIFACT}"
          install -d "$root/bin" "$root/examples" "$root/systemd" "$root/scripts"
          install -m 0755 "target/${TARGET}/release/xenon" "$root/bin/xenon"
          install -m 0755 "target/${TARGET}/release/xenon-agent" "$root/bin/xenon-agent"
          install -m 0644 packaging/xenon.service "$root/systemd/xenon.service"
          install -m 0644 packaging/xenon-agent.service "$root/systemd/xenon-agent.service"
          install -m 0755 scripts/install-agent.sh "$root/scripts/install-agent.sh"
          install -m 0755 scripts/bootstrap-test.sh "$root/scripts/bootstrap-test.sh"
          install -m 0755 scripts/install-test.sh "$root/scripts/install-test.sh"
          install -m 0755 scripts/xenon-tui.sh "$root/scripts/xenon-tui.sh"
          install -m 0644 xenon.toml.example "$root/examples/xenon.toml.example"
          install -m 0644 agent.toml.example "$root/examples/agent.toml.example"
          install -m 0644 CHANGELOG.md "$root/CHANGELOG.md"
          install -m 0644 LICENSE "$root/LICENSE"
          install -m 0644 .ci-xray/LICENSE "$root/XRAY-LICENSE"
          install -m 0644 README.md "$root/README.md"
          tar -C dist -czf "dist/${ARTIFACT}.tar.gz" "$ARTIFACT"
          (cd dist && sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-assets
          find release-assets -maxdepth 2 -type f -print

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*/*.tar.gz \
            release-assets/*/*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Xenon ${GITHUB_REF_NAME}"
